name: Validate live site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, live-site-v1]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
